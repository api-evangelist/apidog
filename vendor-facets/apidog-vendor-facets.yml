# Vendor facets — Apidog. An all-in-one design, debug, mock and docs platform: the provider designs
# the API in Apidog, publishes a docs site (custom domain, Try It, llms.txt, markdown pages) and can
# export OpenAPI 3.1/3.0/2.0 and Postman collections. The widest reach of the non-Postman clients —
# docs, console, llms.txt, contract and collection — but its docs MCP is one npx package keyed by site
# id across every customer (platform grade), and its llms.txt is first-party only on the provider's domain.
vendor: apidog
name: Apidog
website: https://apidog.com
areas:
- api-collections
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Apidog is closer to a docs platform than a local client, and it can move more of a provider's score
  than any collection tool except Postman: a published docs site with Try It, an auto-generated llms.txt,
  an OpenAPI export in 3.1, and a Postman-format export for postman_present. Each counts only once the
  provider publishes it and declares it. The llms.txt is the provider's own only when the site is bound
  to the provider's domain, and the "MCP" button installs one shared npx server per docs site, which the
  rubric grades as a platform template at 0.25, not a server the provider runs.
features:
- id: docs-sites
  name: Published documentation sites
  description: >-
    A hosted, branded docs site on a default *.apidog.io subdomain or the provider's own domain, public
    or access-controlled.
  source: https://docs.apidog.com/publish-docs-sites-631325m0
  tier: all
- id: try-it
  name: Try It on docs pages
  description: Lets readers make requests to the API directly from the documentation page.
  source: https://docs.apidog.com/publish-docs-sites-631325m0
  tier: all
- id: custom-domain
  name: Custom domain for docs sites
  description: Binds the docs site to the provider's own domain, CNAME recommended.
  source: https://docs.apidog.com/custom-domain-631339m0
  tier: unknown
- id: llm-features
  name: LLM-friendly features (llms.txt, markdown pages, copy page)
  description: >-
    Auto-generates llms.txt at the docs root, serves a .md version of every page, and adds a Copy page
    button.
  source: https://docs.apidog.com/llm-friendly-features-1097197m0
  tier: unknown
- id: docs-mcp
  name: Apidog MCP Server for published docs
  description: >-
    Consumers run `npx apidog-mcp-server --site-id=<id>` locally; it reads the public docs site and gives
    an IDE agent the API spec.
  source: >-
    https://docs.apidog.com/connect-online-api-documentation-published-by-apidog-to-ai-via-apidog-mcp-server-901468m0
  tier: all
- id: export
  name: Export to OpenAPI, Postman, HTML, Markdown
  description: >-
    Exports APIs as OpenAPI 3.1, 3.0 or 2.0 (JSON or YAML), a Postman-compatible collection, HTML or Markdown.
  source: https://docs.apidog.com/export-data-635117m0
  tier: all
- id: cloud-mock
  name: Cloud mock
  description: >-
    Mocks served from Apidog's servers, reachable when the designer's machine is off, optionally token-protected.
  source: https://docs.apidog.com/cloud-mock-621066m0
  tier: all
maps:
- feature: docs-sites
  check: documentation_present
  layer: composite
  provider_must: Publish the site publicly and declare its URL as Documentation in apis.yml.
  catalog_pass_rate: 0.453
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.95
  saturated: true
  saturated_note: >-
    95% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: try-it
  check: console_or_sandbox
  layer: composite
  provider_must: Enable Try It and declare the docs page as Console or Playground.
  catalog_pass_rate: 0.089
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.332
- feature: llm-features
  check: llms_txt_published
  layer: composite
  conditional: true
  condition: >-
    Only on a custom domain. Generated from the provider's own docs and served at the provider's root,
    it is the provider's llms.txt; on a default *.apidog.io subdomain it is a vendor-hosted, vendor-generated
    file and grades as derived.
  provider_must: Bind a custom domain, enable llms.txt, and declare the file (LLMsTxt) or let the probe
    find it.
  catalog_pass_rate: 0.351
  facet: discoverability
  points: 4
  baseline_pass_rate: 0.65
- feature: docs-mcp
  check: mcp_server
  layer: agent_readiness
  grade: platform
  note: >-
    One npm package serves every Apidog customer, parameterized by site id, and it runs on the consumer's
    machine. 0.22.0 grades a shared template `platform` (0.25).
  points: 12
  baseline_pass_rate: 0.22
- feature: export
  check: contract_present
  layer: composite
  creates_artifact: true
  provider_must: Publish the exported OpenAPI where the provider controls it and register it in apis.yml.
  note: >-
    For a design-first team this is the provider's own contract, just exported; its quality checks score
    what was designed in Apidog.
  catalog_pass_rate: 0.31
  facet: contract_quality
  points: 20
  baseline_pass_rate: 0.949
  saturated: true
  saturated_note: >-
    95% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: export
  check: openapi_3_1
  layer: composite
  conditional: true
  condition: Only if the provider exports 3.1; 3.0 and 2.0 are also offered.
  catalog_pass_rate: 0.414
  facet: contract_quality
  points: 5
  baseline_pass_rate: 0.411
- feature: export
  check: postman_present
  layer: composite
  credit: 1.0
  provider_must: >-
    Export the Postman collection, host it on a surface the provider controls and declare it as a Postman
    pointer. A collection someone else generated from the provider's spec grades as derived.
  catalog_pass_rate: 0.018
  facet: developer_ergonomics
  points: 2
  baseline_pass_rate: 0.121
earns_nothing:
- feature: cloud-mock
  check: console_or_sandbox
  why: >-
    Already reached through Try It; a mock of designed responses is not a second console and is not the
    API.
- feature: custom-domain
  check: well_known_published
  why: Binding a docs domain serves no api-catalog, security.txt or protected-resource document.
out_of_reach:
  checks:
  - sdk_count_1
  - cli_present
  - agent_skill_present
  - agent_skills
  - change_log_present
  - status_page_present
  note: >-
    The fetched pages publish no SDKs, provider CLI, Agent Skill, changelog or status page for the provider.
surface:
  discoverability:
    reachable: 4.0
